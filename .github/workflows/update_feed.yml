name: Update RSS Feed & Deploy to GitHub Pages

on:
  schedule:
    # Her sabah Türkiye saati ile 09:10'da (06:10 UTC) günlük manşet, tüm haberler ve emtia fiyatlarının güncellenmesi
    - cron: "10 6 * * *"
    # Öğle bülteni ve güncel haber taraması (14:10 TSİ = 11:10 UTC)
    - cron: "10 11 * * *"
    # Akşam bülteni ve kapanış fiyatları (19:10 TSİ = 16:10 UTC)
    - cron: "10 16 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          pip install -r requirements.txt

      - name: Run Pytest Test Suite
        run: |
          pytest tests/ -v

      - name: Generate Static RSS Feed & Portal
        env:
          INOREADER_URL: "https://www.inoreader.com/stream/user/1006125058/tag/SU/view/html?cs=m"
          PUBLIC_BASE_URL: "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}"
        run: |
          python export_static.py

      - name: Commit & Push Updated Data to Repository
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/feed_items.db data/sygm_last_report_url.txt data/sygm_sync_history.json || true
          if ! git diff --cached --quiet; then
            git commit -m "chore(data): sync sqlite database [skip ci]"
            git pull --rebase origin main || true
            git push origin main || echo "Git push skipped"
          else
            echo "No data changes to commit"
          fi

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "dist/"

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
