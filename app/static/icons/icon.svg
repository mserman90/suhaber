<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b2545"/>
      <stop offset="100%" stop-color="#134074"/>
    </linearGradient>
    <linearGradient id="dropGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4ade80"/>
      <stop offset="100%" stop-color="#16a34a"/>
    </linearGradient>
  </defs>
  <!-- Background Circle with subtle shadow -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  
  <!-- Outer Water Ring / Orbit -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="#60a5fa" stroke-width="6" stroke-dasharray="16 12" opacity="0.4"/>

  <!-- Water Drop Silhouette -->
  <path d="M256 96 C256 96, 144 240, 144 330 C144 391.85, 194.15 442, 256 442 C317.85 442, 368 391.85, 368 330 C368 240, 256 96, 256 96 Z" fill="url(#dropGrad)"/>

  <!-- Sprout / Agriculture Leaf inside Drop -->
  <path d="M256 370 C256 310, 310 270, 340 260 C340 310, 290 360, 256 370 Z" fill="url(#leafGrad)"/>
  <path d="M256 370 C256 320, 210 290, 190 285 C190 325, 230 365, 256 370 Z" fill="#22c55e"/>

  <!-- Drop Inner Highlight -->
  <path d="M210 230 C200 270, 205 320, 230 350" fill="none" stroke="#ffffff" stroke-width="12" stroke-linecap="round" opacity="0.45"/>
</svg>
